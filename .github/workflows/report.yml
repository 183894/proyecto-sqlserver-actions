
name: Generar reporte CSV

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  report:
    runs-on: ubuntu-latest

    env:
      ACCEPT_EULA: Y
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Iniciar SQL Server en Docker
        run: |
          docker run -d \
            --name sqlserver \
            -e ACCEPT_EULA=$ACCEPT_EULA \
            -e MSSQL_PID=$MSSQL_PID \
            -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            -v "$GITHUB_WORKSPACE/sql:/scripts:ro" \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Esperar a que SQL Server este listo
        run: |
          echo "Esperando a SQL Server..."

          for i in $(seq 1 60); do
            if docker exec sqlserver \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost \
              -U sa \
              -P "$MSSQL_SA_PASSWORD" \
              -C \
              -b \
              -Q "SELECT 1" > /dev/null 2>&1; then

              echo "SQL Server esta listo."
              exit 0
            fi

            sleep 5
          done

          echo "SQL Server no pudo iniciar."
          docker logs sqlserver
          exit 1

      - name: Crear la base de datos
        run: |
          docker exec sqlserver \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C -b \
            -i /scripts/create_database.sql

      - name: Crear las tablas
        run: |
          docker exec sqlserver \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C -b \
            -i /scripts/create_tables.sql

      - name: Crear el procedimiento almacenado
        run: |
          docker exec sqlserver \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C -b \
            -i /scripts/create_procedure.sql

      - name: Crear el trigger
        run: |
          docker exec sqlserver \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C -b \
            -i /scripts/create_trigger.sql

      - name: Ejecutar datos de prueba
        run: |
          docker exec sqlserver \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C -b \
            -i /scripts/test_data.sql

      - name: Generar reporte CSV
        run: |
          mkdir -p reportes

          docker exec sqlserver \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P "$MSSQL_SA_PASSWORD" \
            -C -b \
            -d EmpresaDB \
            -s "," \
            -W \
            -h -1 \
            -Q "SET NOCOUNT ON; SELECT Producto, Existencias FROM Inventario ORDER BY Producto;" \
            -o /tmp/inventario.csv

          docker cp sqlserver:/tmp/inventario.csv reportes/inventario.csv

          echo "Reporte CSV generado:"
          cat reportes/inventario.csv

      - name: Publicar reporte como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporte-inventario
          path: reportes/inventario.csv
          if-no-files-found: error
          retention-days: 7

      - name: Mostrar logs si falla
        if: failure()
        run: docker logs sqlserver

      - name: Detener SQL Server
        if: always()
        run: |
          docker stop sqlserver || true
          docker rm sqlserver || true

